<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굿즈 계산기</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:#f7f7fb; color:#222;
  }
  .wrap{max-width:900px;margin:0 auto;padding:28px 18px 50px}
  h1{margin:0 0 6px;font-size:28px}
  .sub{margin:0 0 22px;color:#777}
  .card{
    background:#fff;border:1px solid #e8e8ef;border-radius:18px;
    box-shadow:0 6px 24px rgba(30,30,60,.06);overflow:hidden
  }
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:16px;border-bottom:1px solid #eee}
  button{
    border:0;border-radius:10px;padding:10px 14px;cursor:pointer;
    font-weight:700;background:#eeeef4;color:#333
  }
  button.primary{background:#222;color:#fff}
  button.danger{background:#fff0f0;color:#c33}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:620px}
  th,td{padding:12px 14px;border-bottom:1px solid #f0f0f3;text-align:left}
  th{font-size:13px;color:#777;background:#fafafd}
  td input{
    width:100%;border:1px solid #dddde6;border-radius:9px;padding:9px 10px;
    font-size:15px;outline:none
  }
  td input:focus{border-color:#999}
  .price{max-width:150px;text-align:right}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{width:34px;height:34px;padding:0;border-radius:9px}
  .qty input{width:65px;text-align:center}
  .amount{text-align:right;font-weight:700;white-space:nowrap}
  .remove{color:#999;background:transparent;padding:7px}
  .summary{padding:18px;background:#fafafd}
  .row{display:flex;justify-content:space-between;gap:15px;margin:9px 0}
  .row.total{margin-top:15px;padding-top:15px;border-top:1px solid #dddde6;font-size:21px;font-weight:800}
  .summary input{width:140px;text-align:right;border:1px solid #dddde6;border-radius:9px;padding:8px}
  .empty{padding:35px;text-align:center;color:#888}
  .tip{font-size:12px;color:#999;margin-top:10px}
  @media(max-width:600px){
    .wrap{padding:20px 12px 40px} h1{font-size:24px}
    .toolbar button{flex:1}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛍️ 굿즈 계산기</h1>
  <p class="sub">굿즈 가격과 수량을 입력하면 총액을 자동으로 계산해요.</p>

  <div class="card">
    <div class="toolbar">
      <button class="primary" onclick="addItem()">＋ 굿즈 추가</button>
      <button onclick="saveData()">💾 저장</button>
      <button onclick="loadData()">↻ 불러오기</button>
      <button class="danger" onclick="resetAll()">초기화</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:35%">굿즈</th>
            <th style="width:18%">가격</th>
            <th style="width:25%">수량</th>
            <th style="width:18%;text-align:right">금액</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="items"></tbody>
      </table>
    </div>

    <div id="empty" class="empty" style="display:none">굿즈를 추가해 주세요! 😊</div>

    <div class="summary">
      <div class="row">
        <span>상품 합계</span><strong id="subtotal">₩0</strong>
      </div>
      <div class="row">
        <span>배송비</span>
        <input id="shipping" type="number" min="0" step="100" value="0" oninput="calculate()">
      </div>
      <div class="row">
        <span>예산</span>
        <input id="budget" type="number" min="0" step="1000" placeholder="선택" oninput="calculate()">
      </div>
      <div class="row total">
        <span>총액</span><span id="total">₩0</span>
      </div>
      <div class="row" id="remainingRow" style="display:none">
        <span>예산 잔액</span><strong id="remaining">₩0</strong>
      </div>
      <div class="tip">※ 저장 버튼을 누르면 현재 목록이 이 브라우저에 저장됩니다.</div>
    </div>
  </div>
</div>

<script>
let items = [];
const won = n => "₩" + Math.round(n || 0).toLocaleString("ko-KR");

function addItem(name="", price=0, qty=1){
  items.push({name, price, qty});
  render();
}

function removeItem(i){
  items.splice(i,1);
  render();
}

function update(i,key,value){
  if(key==="name") items[i].name=value;
  else items[i][key]=Math.max(0, Number(value)||0);
  calculate();
  renderAmounts();
}

function changeQty(i,delta){
  items[i].qty=Math.max(0, items[i].qty+delta);
  render();
}

function render(){
  const tbody=document.getElementById("items");
  const empty=document.getElementById("empty");
  tbody.innerHTML="";
  empty.style.display=items.length?"none":"block";

  items.forEach((item,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><input value="${escapeHtml(item.name)}" placeholder="예: 포토카드" oninput="update(${i},'name',this.value)"></td>
      <td><input class="price" type="number" min="0" step="100" value="${item.price}" oninput="update(${i},'price',this.value)"></td>
      <td>
        <div class="qty">
          <button onclick="changeQty(${i},-1)">−</button>
          <input type="number" min="0" step="1" value="${item.qty}" oninput="update(${i},'qty',this.value)">
          <button onclick="changeQty(${i},1)">＋</button>
        </div>
      </td>
      <td class="amount" id="amount-${i}">${won(item.price*item.qty)}</td>
      <td><button class="remove" onclick="removeItem(${i})">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
  calculate();
}

function renderAmounts(){
  items.forEach((x,i)=>{
    const el=document.getElementById("amount-"+i);
    if(el) el.textContent=won(x.price*x.qty);
  });
}

function calculate(){
  const subtotal=items.reduce((s,x)=>s+x.price*x.qty,0);
  const shipping=Number(document.getElementById("shipping").value)||0;
  const total=subtotal+shipping;
  document.getElementById("subtotal").textContent=won(subtotal);
  document.getElementById("total").textContent=won(total);

  const budget=Number(document.getElementById("budget").value)||0;
  const row=document.getElementById("remainingRow");
  if(budget>0){
    row.style.display="flex";
    const rem=budget-total;
    document.getElementById("remaining").textContent=(rem<0?"−":"")+won(Math.abs(rem));
  } else row.style.display="none";
}

function saveData(){
  localStorage.setItem("goodsCalculator",JSON.stringify({
    items,
    shipping:document.getElementById("shipping").value,
    budget:document.getElementById("budget").value
  }));
  alert("저장했어요! 💾");
}

function loadData(){
  const raw=localStorage.getItem("goodsCalculator");
  if(!raw){alert("저장된 목록이 없어요.");return}
  const d=JSON.parse(raw);
  items=d.items||[];
  document.getElementById("shipping").value=d.shipping||0;
  document.getElementById("budget").value=d.budget||"";
  render();
}

function resetAll(){
  if(!confirm("목록과 금액을 모두 초기화할까요?")) return;
  items=[]; document.getElementById("shipping").value=0; document.getElementById("budget").value="";
  render();
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

const defaultItems = [
  ["트라이엄프 아크릴 스탠드", 28000],
  ["데이트 아크릴 스탠드 (재경)", 19000],
  ["데이트 아크릴 스탠드 (단)", 19000],
  ["어린이 아크릴 스탠드 (재경)", 19000],
  ["어린이 아크릴 스탠드 (단)", 19000],
  ["밍그레 아크릴 블록", 15000],
  ["컬포", 5000],
  ["컬렉션 미니 블록", 6500],
  ["컬렉션 미니 스탠드", 4200],
  ["캔뱃지 세트", 9000],
  ["어린이 캔뱃지 세트", 9000],
  ["경단스튜디오 데이트 사진팩", 5000],
  ["MFC 주재경 슬로건", 18000],
  ["주재경 글러브 키링", 21000],
  ["주재경의 성장 기록 패키지", 20000],
  ["김단의 성장 기록 패키지", 24400],
  ["주재경 트레카", 4000],
  ["엽서 세트", 18000],
  ["허그베어 필름 패키지", 10500],
  ["늑대 재경 쿠션", 30000],
  ["햄찌 단이 쿠션", 30000],
  ["LED 옥타곤 디오라마", 33000],
  ["김단 선생의 지명사진 패키지", 7000],
  ["미니 쿠션 키링", 7700],
  ["마우스 패드 패키지", 30000],
  ["트라이엄프 포스터", 14200],
  ["주재경 빅쿠션 커버", 38000],
  ["블랭킷", 30000],
  ["뽀시래기 MFC 선수복", 15000],
  ["뽀시래기 물리치료사 유니폼", 23000],
  ["뽀시래기 동물 모자 세트", 23000],
  ["팀블랙 더플백", 105000],
  ["팀블랙 폴로 셔츠", 62000]
];

defaultItems.forEach(([name, price]) => addItem(name, price, 1));
</script>
</body>
</html>
